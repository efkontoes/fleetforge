name: lakehouse

# Milestone 3: checks the lakehouse code on every PR, then runs the same staged
# stack tests as `make -f lakehouse.mk ...` locally: Spark, then Trino, then Kafka,
# one phase at a time with the container memory limits of the 3.7 GiB dev machine.
on:
  pull_request:
  push:
    branches: [main, milestone-3-lakehouse]
  workflow_dispatch:

concurrency:
  group: lakehouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e '.[dev]' pip-audit
      - run: ruff check infrastructure/lakehouse infrastructure/airflow scripts && ruff format --check infrastructure/lakehouse infrastructure/airflow scripts
      - name: Lakehouse unit tests (no Java)
        run: pytest tests/unit -p no:logging -k lakehouse
      - name: Table schema document is generated from the specifications
        run: python scripts/render_lakehouse_tables.py && git diff --exit-code docs/architecture/milestone-3-tables.md
      - name: Compose file is valid for every lakehouse profile
        run: |
          sh scripts/make-lakehouse-env.sh
          for p in jobs query; do
            docker compose --env-file .env.lakehouse -f infrastructure/lakehouse/compose.yaml --profile $p config -q
          done
      - name: Known-vulnerable dependencies (lakehouse lock file)
        run: pip-audit -r requirements-lakehouse.lock --strict

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [checks]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: sh scripts/make-lakehouse-env.sh && sh scripts/make-env.sh
      - name: Build the Spark image
        run: make -f lakehouse.mk lake-build
      - name: "Phase 1: S3 conformance and Spark/Iceberg (Garage, catalog DB, Spark)"
        run: make -f lakehouse.mk lake-test
      - name: "Phase 2: Trino reads what phase 1 left (Spark stopped)"
        run: make -f lakehouse.mk lake-test-trino
      - name: "Phase 3: Bronze from real Kafka (Milestone 2 kafka + schema-registry only)"
        run: |
          docker compose --env-file .env.lakehouse -f infrastructure/lakehouse/compose.yaml --profile query rm -sf trino
          docker compose --profile core up -d --wait kafka schema-registry
          make -f lakehouse.mk lake-test-kafka
      - name: Memory at the end
        if: always()
        run: docker stats --no-stream; free -m
      - name: Service logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.lakehouse -f infrastructure/lakehouse/compose.yaml --profile query logs --tail 200
          sudo dmesg | grep -i -E "oom|killed process" | tail -5 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: lakehouse-junit
          path: build/lakehouse-evidence/*.xml
