name: platform

# Platform checks, fast level: DAGs, dbt, ML code, alert rules and Terraform, checked
# without starting any data services. Runs on every pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dags-and-dbt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: sh scripts/make-lakehouse-env.sh
      - name: Airflow image and DAG checks (imports, retries, timeouts, pools, order)
        run: |
          docker build -f infrastructure/airflow/Dockerfile -t fleetforge-airflow:dev .
          docker run --rm -v "$PWD/infrastructure/airflow/check_dags.py:/check_dags.py:ro" \
            fleetforge-airflow:dev python /check_dags.py
      - name: Airflow compose file is valid
        run: |
          docker network create fleetforge_default
          docker compose --env-file .env.lakehouse -f infrastructure/lakehouse/compose.yaml \
            -f infrastructure/airflow/compose.yaml --profile airflow config -q
      - name: dbt project parses (models, contracts, tests)
        run: |
          docker build -f infrastructure/lakehouse/dbt/Dockerfile -t fleetforge-lakehouse-dbt:dev .
          docker run --rm -e DBT_TARGET=test fleetforge-lakehouse-dbt:dev parse


  ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-ml.lock pytest==8.4.2 && pip install --no-deps -e .
      - name: Label, leakage, drift and training tests
        run: pytest tests/ml -p no:cacheprovider -q --confcutdir tests/ml  # the root conftest needs M2 deps

  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Alert rules fire as their tests expect
        run: |
          docker run --rm -v "$PWD/infrastructure/lakehouse/prometheus:/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 test rules /rules/lakehouse-alerts.test.yml

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {working-directory: infrastructure/terraform}
    env:
      TF: docker run --rm -v ${{ github.workspace }}/infrastructure/terraform:/tf -w /tf -e AWS_ACCESS_KEY_ID=ci-placeholder -e AWS_SECRET_ACCESS_KEY=ci-placeholder hashicorp/terraform:1.16.7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: $TF fmt -check -recursive
      - run: $TF init -input=false -backend=false
      - run: $TF validate
      - name: Plan with placeholder credentials (offline_plan; nothing is created)
        run: $TF plan -input=false -lock=false -refresh=false -var-file=ci.tfvars
      - name: Static security checks (any finding fails the build)
        run: |
          docker run --rm -v "$PWD:/tf:ro" aquasec/trivy:0.76.0 config --exit-code 1 \
            --severity LOW,MEDIUM,HIGH,CRITICAL --ignorefile /tf/.trivyignore /tf
