global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files: [alerts.yml]

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]

  # Projector replicas are discovered through Docker DNS (one A record per replica),
  # so each instance is its own target and dashboards aggregate with sum()/max().
  - job_name: projector
    dns_sd_configs:
      - names: [projector]
        type: A
        port: 9101
        refresh_interval: 15s

  - job_name: mission-consumer
    static_configs: [{targets: ["mission-consumer:9102"]}]

  - job_name: ops
    scrape_interval: 15s
    static_configs: [{targets: ["ops-exporter:9103"]}]

  - job_name: kafka
    scrape_interval: 15s
    static_configs: [{targets: ["kafka-exporter:9308"]}]
