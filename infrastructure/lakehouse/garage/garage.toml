# Single-node Garage for the local lakehouse (ADR 0015). Secrets come from the
# environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN), never from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Iceberg S3FileIO (client.region) and Trino (s3.region) sign requests for this region.
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
