# Iceberg tables written by Spark, read through the same JDBC catalog.
# iceberg.jdbc-catalog.catalog-name must equal the Spark catalog name ("lake"): it is
# the value of the catalog_name column in the catalog's iceberg_tables table.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://catalog-db:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=${ENV:LAKEHOUSE_CATALOG_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://lakehouse/warehouse
fs.s3.enabled=true
s3.endpoint=http://garage:3900
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:LAKEHOUSE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAKEHOUSE_S3_SECRET_KEY}
