[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetforge"
version = "0.1.0"
description = "Fault-tolerant data platform for autonomous robot fleets (Milestone 1: operational foundation)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "confluent-kafka[avro,schemaregistry]>=2.16",
    "fastavro>=1.9",  # decoded directly (kafka/codec.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "testcontainers[postgres]>=4.7",
    "ruff==0.17.4",
]
# Milestone 3 Spark jobs and lakehouse stack tests (needs Java 17/21 at runtime; see
# docs/architecture/milestone-3.md, "Technology inventory").
lakehouse = [
    "pyspark==4.1.4",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "trino==0.340.0",
]

[project.scripts]
fleet-sim = "fleetforge.simulator.cli:main"
fleet-projector = "fleetforge.projector.main:main"
fleet-mission-consumer = "fleetforge.projector.missions:main"
fleet-replay = "fleetforge.projector.replay:main"
fleet-schemas = "fleetforge.kafka.schemas:main"
fleet-ops-exporter = "fleetforge.ops.exporter:main"
fleetforge = "fleetforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fleetforge.contracts" = ["avro/*.avsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A hung test dumps every thread's stack after 5 min (CI run 43338045324 hung for
# 40 min with no output). Stack steps in CI also pass --timeout to fail, not hang.
faulthandler_timeout = 300
markers = [
    "integration: needs a real PostgreSQL instance",
    "stack: needs the running Compose stack (FLEETFORGE_STACK=1)",
    "disruptive: stops or restarts stack services (run last, one at a time)",
    "lakehouse: needs the Milestone 3 lakehouse stack (FLEETFORGE_LAKEHOUSE=1)",
    "lakehouse_kafka: also needs Kafka and the schema registry",
    "lakehouse_trino: needs Trino; reads the tables test_slice.py leaves behind",
    "lakehouse_s3: needs only the object store (S3 conformance probe)",
]
filterwarnings = [
    # Starlette's TestClient nudges towards httpx2; httpx is still supported and used
    # by the simulator, so one HTTP client library is kept for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# PromQL expressions are data; wrapping them hurts readability more than long lines.
"scripts/build_dashboard.py" = ["E501"]
# Stack tests embed SQL and multi-service assertions; readability beats wrapping.
"tests/stack/*" = ["E501"]
"tests/lakehouse/*" = ["E501"]
"benchmarks/*" = ["E501"]
